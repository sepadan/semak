<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEMAK — Sistem Markah SK Paya Redan</title>

<!--
  Halaman lompatan (redirect).

  SEMAK berjalan pada Google Apps Script, bukan di GitHub Pages.
  GitHub Pages hanya menyajikan fail statik — ia tiada capaian ke Google
  Sheets, jadi sistem sebenar tidak boleh berjalan di sini. Halaman ini
  cuma menghantar pelawat ke web app Apps Script yang sebenar.

  ⚠️ BILA URL WEB APP BERUBAH, TUKAR DI SINI JUGA.
  URL berubah hanya jika anda buat "New deployment" (bukan "New version").
  Dapatkan URL terkini: Apps Script → Deploy → Manage deployments →
  salin "Web app URL".
-->

<script>
  var URL_SISTEM = "https://script.google.com/macros/s/AKfycbx306dN8vd3HR3Mu4xdum8MpG0PkbbwbKgsu88jx-nMG2LnEWszU350S2ez8TU_kX_H/exec";
  // replace() supaya butang "back" tidak terperangkap dalam gelung
  window.location.replace(URL_SISTEM);
</script>

<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f0f2f5; color: #222;
         margin: 0; display: flex; align-items: center; justify-content: center;
         min-height: 100vh; text-align: center; padding: 20px; }
  .kotak { background: #fff; border-radius: 12px; padding: 40px 32px;
           box-shadow: 0 2px 12px rgba(0,0,0,.1); max-width: 420px; }
  h1 { color: #1a237e; font-size: 18pt; margin: 0 0 6px; }
  p  { color: #555; font-size: 11pt; line-height: 1.6; margin: 0 0 20px; }
  .spinner { border: 4px solid #e8eaf6; border-top: 4px solid #1a237e;
             border-radius: 50%; width: 38px; height: 38px;
             animation: putar 1s linear infinite; margin: 0 auto 22px; }
  @keyframes putar { to { transform: rotate(360deg); } }
  a.btn { display: inline-block; background: #1a237e; color: #fff; padding: 13px 28px;
          border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 11pt; }
  a.btn:hover { background: #283593; }
  small { display: block; margin-top: 22px; color: #999; font-size: 8.5pt; }
</style>
</head>
<body>
  <div class="kotak">
    <div class="spinner"></div>
    <h1>📘 SEMAK</h1>
    <p>Membuka Sistem Markah SK Paya Redan…</p>
    <a class="btn" id="pautan" href="#">Buka Sistem</a>
    <small>Tidak berpindah secara automatik? Klik butang di atas.</small>
  </div>

  <script>
    // Isi pautan sandaran daripada pemboleh ubah yang sama —
    // supaya hanya ada satu tempat untuk dikemas kini.
    document.getElementById("pautan").href = URL_SISTEM;
  </script>
</body>
</html>
